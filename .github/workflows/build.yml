name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  FLUTTER_VERSION: 3.47.6

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          cat > android/key.properties <<EOF
          storeFile=$RUNNER_TEMP/release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=gallery
          keyPassword=$KEYSTORE_PASSWORD
          EOF

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      - name: Build APKs
        run: |
          flutter build apk --release --split-debug-info=build/symbols
          cp build/app/outputs/flutter-apk/app-release.apk gallery-android-universal.apk
          flutter build apk --release --split-per-abi --split-debug-info=build/symbols
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk gallery-android-arm64.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk gallery-android-armv7.apk

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: gallery-android-*.apk

  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04-arm
            arch: arm64
          - runner: ubuntu-24.04
            arch: x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev libmpv-dev

      # The flutter-action archives are x64-only; a git checkout works on both.
      - name: Flutter
        run: |
          git clone --depth 1 --branch "$FLUTTER_VERSION" https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"

      - run: flutter config --no-analytics && flutter pub get
      - run: flutter build linux --release --split-debug-info=build/symbols

      - name: Package
        run: |
          bundle=build/linux/${{ matrix.arch }}/release/bundle
          cp linux/packaging/gallery.desktop linux/packaging/install.sh "$bundle/"
          tar -C "$(dirname "$bundle")" --transform 's,^bundle,gallery,' \
            -czf gallery-linux-${{ matrix.arch }}.tar.gz bundle

      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: gallery-linux-*.tar.gz

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            gallery-android-*.apk
            gallery-linux-*.tar.gz
